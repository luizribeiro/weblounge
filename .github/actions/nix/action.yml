---
name: nix
description: >-
  Install Nix with KVM, substituting from the weblounge Cachix cache and
  pushing what it builds there when given a token

inputs:
  free-disk:
    description: Remove the runner image's unused toolchains first
    default: "true"
  # Each VM test boots two or more VMs; four at once outgrow the
  # runner's 16 GB, and it gets shut down mid-check.
  max-jobs:
    description: How many builds Nix runs at once
    default: "2"
  cachix-auth-token:
    description: Token to push to Cachix with; pull only if empty
    default: ""

runs:
  using: composite
  steps:
    # The VM tests need /dev/kvm, which the runner's user can't open.
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # A cold build of the host fills more than some runners have free.
    - name: Free disk space
      if: inputs.free-disk == 'true'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          system-features = nixos-test benchmark big-parallel kvm
          max-jobs = ${{ inputs.max-jobs }}

    # Lets CI run before the cache exists, or while Cachix is down.
    - id: cachix
      shell: bash
      run: |
        if curl -sfo /dev/null https://weblounge.cachix.org/nix-cache-info; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.cachix.outputs.available == 'true'
      uses: cachix/cachix-action@v17
      with:
        name: weblounge
        authToken: ${{ inputs.cachix-auth-token }}
