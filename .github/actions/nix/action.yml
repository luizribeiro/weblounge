---
name: nix
description: Install Nix with KVM, restoring the store a deps job saved

inputs:
  store-key:
    description: Key of the cached Nix store to restore; none if empty
    default: ""
  save-store:
    description: Save the store under store-key when the job ends
    default: "false"

runs:
  using: composite
  steps:
    # The VM tests need /dev/kvm, which the runner's user can't open.
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The restored store unpacks to more than some runners have free.
    - name: Free disk space
      if: inputs.store-key != ''
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /

    - uses: cachix/install-nix-action@v31
      with:
        # Each VM test boots two or more VMs; four at once outgrow the
        # runner's 16 GB, and it gets shut down mid-check.
        extra_nix_config: |
          system-features = nixos-test benchmark big-parallel kvm
          max-jobs = 2

    # Falls back to the newest store when this key has none yet, so
    # a changed input rebuilds only what depends on it.
    - if: inputs.store-key != '' && inputs.save-store != 'true'
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: ${{ inputs.store-key }}
        restore-prefixes-first-match: store-

    - if: inputs.store-key != '' && inputs.save-store == 'true'
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: ${{ inputs.store-key }}
        restore-prefixes-first-match: store-
        purge: true
        purge-prefixes: store-
        purge-last-accessed: P1D
        purge-primary-key: never
