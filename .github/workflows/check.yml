---
name: check

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR's new commits supersede its running check; every push to main gets
# its own group, so none is cancelled or dropped from the queue.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Evaluating every check in one process, as `nix flake check` does,
# outgrows the runner's 16 GB, so each check gets a job of its own.
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
        with:
          free-disk: "false"
      # Lists only the checks whose results no cache has. A worker can
      # take 4.6 GB evaluating a VM test, so two fit in the 16 GB. A check
      # that fails to evaluate has no isCached and gets a job to show why.
      - id: list
        run: |
          nix run --inputs-from . nixpkgs#nix-eval-jobs -- \
            --flake .#checks.x86_64-linux --check-cache-status \
            --workers 2 --max-memory-size 3072 > jobs.jsonl
          [ -s jobs.jsonl ]
          checks=$(jq -sc 'map(select(.isCached | not) | .attr)' jobs.jsonl)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  # Builds what most checks share, the crates, the web client and their
  # toolchains among it, once, into Cachix for the other jobs.
  deps:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          max-jobs: auto
      - run: nix build -L --no-link .#checks.x86_64-linux.toplevel-credenza

  # What `nix flake check` evaluates besides the checks.
  outputs:
    needs: [list, deps]
    if: ${{ !cancelled() && needs.list.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate packages and formatter
        run: |
          nix eval --json .#packages.x86_64-linux \
            --apply 'builtins.mapAttrs (_: p: p.drvPath)'
          nix eval .#formatter.x86_64-linux.drvPath
      - name: Build the dev shell
        run: nix build -L --no-link .#devShells.x86_64-linux.default

  build:
    needs: [list, deps]
    if: >-
      ${{ !cancelled() && needs.list.result == 'success'
      && needs.list.outputs.checks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list.outputs.checks) }}
    name: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build -L --no-link .#checks.x86_64-linux.${{ matrix.check }}

  # The one status to require: it passes only if every job above did, or
  # was skipped because its checks were all cached.
  check:
    needs: [list, deps, outputs, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: >-
            ${{ needs.list.result }} ${{ needs.deps.result }}
            ${{ needs.outputs.result }}
            ${{ needs.list.outputs.checks == '[]' && 'success'
            || needs.build.result }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
