---
name: check

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR's new commits supersede its running check; every push to main gets
# its own group, so none is cancelled or dropped from the queue.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Evaluating every check in one process, as `nix flake check` does,
# outgrows the runner's 16 GB, so each check gets a job of its own.
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - id: list
        run: |
          checks=$(nix eval --json .#checks.x86_64-linux \
            --apply builtins.attrNames)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  # What `nix flake check` evaluates besides the checks.
  outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - name: Evaluate packages and formatter
        run: |
          nix eval --json .#packages.x86_64-linux \
            --apply 'builtins.mapAttrs (_: p: p.drvPath)'
          nix eval .#formatter.x86_64-linux.drvPath
      - name: Build the dev shell
        run: nix build -L --no-link .#devShells.x86_64-linux.default

  build:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list.outputs.checks) }}
    name: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - run: nix build -L --no-link .#checks.x86_64-linux.${{ matrix.check }}

  # The one status to require: it passes only if every job above did.
  check:
    needs: [list, outputs, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
