---
name: check

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR's new commits supersede its running check; every push to main gets
# its own group, so none is cancelled or dropped from the queue.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # The VM tests need /dev/kvm, which the runner's user can't open.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          # Each VM test boots two or more VMs; four at once outgrow the
          # runner's 16 GB, and it gets shut down mid-check.
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            max-jobs = 2

      - run: nix develop --command just check
