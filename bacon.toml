# `just concierge dev` runs this job; it sets the environment concierge reads.
[jobs.serve]
# It migrates first, as concierge-migrate.service does on the server.
command = [
  "sh", "-c",
  "cargo run --color always --package concierge -- migrate && exec cargo run --color always --package concierge -- serve",
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
# esbuild rewrites the manifest on every rebuild; a restart picks it up and
# the page's live-reload script reloads once the server is back.
watch = ["crates/concierge/templates", "target/dev/assets"]
apply_gitignore = false
