[package]
name = "common"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Helpers for the tests of the crates that build on this one.
testing = ["dep:tempfile"]

[dependencies]
anyhow = "1.0.104"
libc = "0.2.190"
rand = "0.10.3"
secret = { path = "../secret" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
regex = "1.13.1"
tempfile = "3.27.0"
