[package]
name = "concierge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ergo-api = { path = "../ergo-api" }
hmac = "0.12.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
tower-livereload = "0.10.3"

[dev-dependencies]
ergo-api = { path = "../ergo-api", features = ["fake"] }
http-body-util = "0.1.5"
regex = "1.13.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
