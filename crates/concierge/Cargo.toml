[package]
name = "concierge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
common = { path = "../common" }
ergo-api = { path = "../ergo-api" }
filehost = { path = "../filehost" }
form_urlencoded = "1.2.2"
hmac = "0.12.1"
http-body-util = "0.1.5"
outbox = { path = "../outbox" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
secret = { path = "../secret" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["io-util", "macros", "rt-multi-thread", "net", "time"] }
tower-livereload = "0.10.3"

[dev-dependencies]
common = { path = "../common", features = ["testing"] }
ergo-api = { path = "../ergo-api", features = ["fake"] }
filehost = { path = "../filehost", features = ["testing"] }
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["test-util"] }
outbox = { path = "../outbox", features = ["testing"] }
regex = "1.13.1"
rqrr = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
