{% extends "help-page.html" %}

{% block title %}Help{% endblock %}

{% block help %}

      <h1>How can we help?</h1>
      <p class="lede">Short answers for the things people ask about most.</p>
      <ul class="help-topics">

        {%- endfor %}
      </ul>
{%- endblock %}
