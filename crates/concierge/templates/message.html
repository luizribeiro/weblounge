{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
      <section class="{% if card %}card narrow{% else %}message{% endif %}">
        <p class="eyebrow">{{ eyebrow }}</p>
        <h1>{{ title }}</h1>
        {%- for line in lines %}
        <p class="lede">{{ line }}</p>
        {%- endfor %}
        {%- if let Some(next) = next %}
        <p><a class="button button-primary" href="{{ next.href }}">{{ next.label }}</a></p>
        {%- endif %}
      </section>
{%- endblock %}
