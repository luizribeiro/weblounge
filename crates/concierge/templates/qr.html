{% extends "base.html" %}

{% block title %}Invite QR code{% endblock %}

{% block content %}
      <section class="qr-page" aria-labelledby="qr-title">
        <p class="eyebrow">Invite · {{ invite.time_left }} left</p>
        <h1 id="qr-title">Scan to join.</h1>
        <figure class="qr">
          <div class="qr-code" role="img" aria-label="QR code of the invite link">{{ svg|safe }}</div>
          <figcaption><code class="invite-link">{{ invite.url }}</code></figcaption>
        </figure>
        <p class="hint">Works once. Whoever scans it first gets the seat.</p>
        <p class="links"><a href="/#invites">Back to invites</a></p>
      </section>
{%- endblock %}
