[package]
name = "ergo-api"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# An in-memory stand-in for Ergo's API, for tests.
fake = ["dep:axum", "dep:tokio"]
# The real ergo binary on loopback, for contract tests and the dev loop.
local = []

[[bin]]
name = "local-ergo"
required-features = ["local"]

[dependencies]
axum = { version = "0.8.9", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
secret = { path = "../secret" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "rt"], optional = true }

[dev-dependencies]
# The unit tests' stub server needs axum and tokio too.
ergo-api = { path = ".", features = ["fake", "local"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "time"] }
