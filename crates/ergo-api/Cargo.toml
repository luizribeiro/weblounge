[package]
name = "ergo-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["macros", "net", "rt"] }
