[package]
name = "filehost"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# A scrubber that stores uploads unscrubbed, for concierge's tests.
testing = ["dep:tempfile"]

[dependencies]
common = { path = "../common" }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
common = { path = "../common", features = ["testing"] }
