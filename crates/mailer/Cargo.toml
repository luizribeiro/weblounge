[package]
name = "mailer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
common = { path = "../common" }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "rustls-native-certs", "ring"] }
outbox = { path = "../outbox" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "time"] }

[dev-dependencies]
outbox = { path = "../outbox", features = ["testing"] }
regex = "1.13.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["io-util"] }
