[package]
name = "outbox"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# A migrated outbox in a temporary directory, for the tests of the crates
# that queue and send its mail.
testing = ["dep:tempfile"]

[dependencies]
age = "0.11.5"
anyhow = "1.0.104"
common = { path = "../common" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
common = { path = "../common", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt", "time"] }
