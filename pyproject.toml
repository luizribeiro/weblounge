[tool.ruff]
line-length = 120
target-version = "py313"
src = ["tests/e2e/lib", "tests/e2e/clients"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ty.environment]
# The dev shell links the Python environment of tests/e2e/lib/python.nix here.
python = ".python"
extra-paths = ["tests/e2e/lib", "tests/e2e/clients"]
