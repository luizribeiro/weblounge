<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svgNode = (name, attributes = {}) => {
    const el = document.createElementNS(NS, name);
    Object.entries(attributes).forEach(([key, value]) => el.setAttribute(key, value));
    return el;
  };
  const mod = (value, base) => ((value % base) + base) % base;
  const numbersIn = d => d.match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi).map(Number);

  const svg = document.getElementById('chair');
  const media = window.matchMedia('(prefers-reduced-motion: reduce)');
  const nodeEls = [...svg.querySelectorAll('.chair-nodes > circle')];
  const edgeEls = [...svg.querySelectorAll('.chair-edges > path')];
  const layer = svg.querySelector('.chair-nodes').parentElement;

  // The drawing is the only copy of the geometry: every edge starts and ends
  // exactly on a node, which is how edges learn which nodes they connect.
  const home = nodeEls.map(c => ({ x:+c.getAttribute('cx'), y:+c.getAttribute('cy'), r:+c.getAttribute('r') }));
  const nodeAt = (x, y) => home.findIndex(n => n.x === x && n.y === y);
  const edges = edgeEls.map(path => {
    const d = path.getAttribute('d'), v = numbersIn(d);
    return { d, a:nodeAt(v[0], v[1]), b:nodeAt(v[v.length-2], v[v.length-1]) };
  });

  const measurements = edgeEls.map(path => path.getTotalLength());
  const routes = [
    [50,40,36,31,26,23,9,6,3,0],
    [52,41,34,10,8,6,4,2],
    [48,39,38,28,21,18,17,16,23,14,6,1]
  ].map(route => {
    let total = 0;
    const segments = route.slice(0,-1).map((a,index) => {
      const b = route[index+1];
      const ei = edges.findIndex(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));
      const segment = { edge:ei, start:total, length:measurements[ei], forward:edges[ei].a === a };
      total += segment.length; return segment;
    });
    return { total, segments };
  });
  const packets = routes.map(() => {
    const halo = svgNode('circle', { r:'8', fill:'none', stroke:'currentColor', 'stroke-width':'.7', opacity:'.16' });
    const dot = svgNode('circle', { r:'3.4', opacity:'.95' });
    svg.querySelector('.packets').append(halo,dot); return { dot, halo };
  });
  // Packets ride the live, possibly stretched paths, so lengths are re-read.
  function routePosition(route, fraction) {
    const target = Math.max(0,Math.min(.999999,fraction)) * route.total;
    let segment = route.segments[route.segments.length-1];
    for (const s of route.segments) { if (target < s.start + s.length) { segment = s; break; } }
    let f = (target - segment.start) / segment.length;
    if (!segment.forward) f = 1-f;
    const path = edgeEls[segment.edge];
    return path.getPointAtLength(f * path.getTotalLength());
  }

  const particles = home.map(n => ({ x:n.x, y:n.y, vx:0, vy:0 }));
  const neighbours = home.map(() => []);
  const degree = home.map(() => 0);
  edges.forEach(e => { degree[e.a]++; degree[e.b]++; });

  // Springs resist changes to the rest vectors, rather than trying to turn
  // the drawing into a generic force-directed blob. Curved outlines retain
  // their original bow, even when their endpoints turn and stretch.
  const links = edges.map(e => {
    const a = home[e.a], b = home[e.b];
    const dx = b.x-a.x, dy = b.y-a.y, length = Math.hypot(dx,dy);
    const values = numbersIn(e.d);
    const kind = e.d.includes('C') ? 'C' : e.d.includes('Q') ? 'Q' : 'L';
    const controls = [];
    for (let j=2; j<values.length-2; j+=2) {
      const cx=values[j]-a.x, cy=values[j+1]-a.y;
      controls.push({ t:(cx*dx+cy*dy)/(length*length), normal:(dx*cy-dy*cx)/length });
    }
    const stiffness = 70 / Math.sqrt(Math.max(degree[e.a],degree[e.b]));
    neighbours[e.a].push({i:e.b,k:stiffness});
    neighbours[e.b].push({i:e.a,k:stiffness});
    return { a:e.a,b:e.b,dx,dy,length,kind,controls,k:stiffness };
  });
  const originalPaths = edges.map(e => e.d);
  const hits = svgNode('g', { 'aria-hidden':'true' });
  const hitEls = home.map(n => {
    const c = svgNode('circle', { cx:n.x,cy:n.y,r:16,class:'node-target' });
    hits.appendChild(c); return c;
  });
  layer.appendChild(hits);

  const ANCHOR=34, DAMPING=8.2, STEP=1/120, HOVER_RADIUS=83;
  const POINTER_FORCE=1580, MAX_SPEED=950;
  let alive=false, drawn=false, accumulator=0, cssScale=1;
  let drag=null, pointer={x:0,y:0,inside:false}, hoverSuppressed=false;
  let bounds={left:-42,right:601,top:-16,bottom:605};

  function updateMetrics() {
    const ctm=layer.getScreenCTM();
    if (!ctm) return;
    cssScale=Math.max(.05,Math.hypot(ctm.a,ctm.b));
    const coarse=window.matchMedia('(pointer:coarse)').matches;
    home.forEach((n,i) => hitEls[i].setAttribute('r', Math.max(n.r+4,(coarse?20:13)/cssScale)));
    // Derive local limits from the actual viewBox, not viewport pixels.
    const m=layer.getCTM(), s=svg.getCTM();
    if (m && s) {
      const inverse=m.inverse().multiply(s), box=svg.viewBox.baseVal;
      const tl=new DOMPoint(box.x,box.y).matrixTransform(inverse);
      const br=new DOMPoint(box.x+box.width,box.y+box.height).matrixTransform(inverse);
      bounds={left:tl.x+16,right:br.x-16,top:tl.y+16,bottom:br.y-16};
    }
  }
  updateMetrics();

  function localPoint(event) {
    const ctm=layer.getScreenCTM();
    if (!ctm) return null;
    cssScale=Math.max(.05,Math.hypot(ctm.a,ctm.b));
    const p=new DOMPoint(event.clientX,event.clientY).matrixTransform(ctm.inverse());
    return Number.isFinite(p.x)&&Number.isFinite(p.y) ? p : null;
  }
  function nearest(p,touch=false) {
    let best=-1, distance=(touch?23:16)/cssScale;
    particles.forEach((n,i) => {
      const d=Math.hypot(n.x-p.x,n.y-p.y);
      if (d<distance) { distance=d;best=i; }
    });
    return best;
  }
  function hasHover() {
    return pointer.inside && !hoverSuppressed && !media.matches && !drag &&
      home.some(n => Math.hypot(n.x-pointer.x,n.y-pointer.y)<HOVER_RADIUS);
  }
  function targetFor(p) {
    const n=home[drag.i];
    let dx=p.x-drag.offsetX-n.x,dy=p.y-drag.offsetY-n.y;
    const distance=Math.hypot(dx,dy);
    // Direct manipulation for the first 125 SVG units, then a soft limit.
    if (distance>125) {
      const extra=distance-125,limited=125+extra/(1+extra/130);
      dx*=limited/distance;dy*=limited/distance;
    }
    return {
      x:Math.max(bounds.left,Math.min(bounds.right,n.x+dx)),
      y:Math.max(bounds.top,Math.min(bounds.bottom,n.y+dy))
    };
  }
  function pin() {
    if (!drag) return;
    const n=particles[drag.i];
    n.x=drag.x;n.y=drag.y;n.vx=0;n.vy=0;
  }
  function restore() {
    home.forEach((n,i) => {
      Object.assign(particles[i],{x:n.x,y:n.y,vx:0,vy:0});
      if (drawn) {
        nodeEls[i].setAttribute('cx',n.x);nodeEls[i].setAttribute('cy',n.y);
        hitEls[i].setAttribute('cx',n.x);hitEls[i].setAttribute('cy',n.y);
      }
    });
    if (drawn) edgeEls.forEach((p,i) => p.setAttribute('d',originalPaths[i]));
    alive=false;drawn=false;accumulator=0;
  }
  const number=n => Math.round(n*1000)/1000;
  function draw() {
    particles.forEach((n,i) => {
      const x=number(n.x),y=number(n.y);
      nodeEls[i].setAttribute('cx',x);nodeEls[i].setAttribute('cy',y);
      hitEls[i].setAttribute('cx',x);hitEls[i].setAttribute('cy',y);
    });
    links.forEach((e,i) => {
      const a=particles[e.a],b=particles[e.b];
      let d=`M${number(a.x)},${number(a.y)} ${e.kind}`;
      if (e.controls.length) {
        const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy);
        const nx=length>.001 ? -dy/length : 0,ny=length>.001 ? dx/length : 0;
        const bow=Math.max(0,Math.min(1.25,Math.sqrt(length/e.length)));
        d+=e.controls.map(c => `${number(a.x+c.t*dx+nx*c.normal*bow)},${number(a.y+c.t*dy+ny*c.normal*bow)}`).join(' ')+' ';
      }
      d+=`${number(b.x)},${number(b.y)}`;
      edgeEls[i].setAttribute('d',d);
    });
    drawn=true;
  }

  // With reduced motion, an intentional drag still works. Its neighbours
  // follow a static equilibrium; there is no hover animation or rebound.
  function solveStill() {
    pin();
    for (let pass=0;pass<28;pass++) {
      particles.forEach((n,i) => {
        if (drag && i===drag.i) return;
        let x=0,y=0,k=ANCHOR;
        neighbours[i].forEach(link => {
          const b=particles[link.i],h=home[link.i];
          x+=(b.x-h.x)*link.k;y+=(b.y-h.y)*link.k;k+=link.k;
        });
        n.x=home[i].x+x/k;n.y=home[i].y+y/k;n.vx=n.vy=0;
      });
    }
    draw();
  }
  function integrate(dt) {
    pin();
    const hover=hasHover();
    const forces=particles.map((n,i) => {
      let x=(home[i].x-n.x)*ANCHOR,y=(home[i].y-n.y)*ANCHOR;
      if (hover) {
        // Rest-space sampling keeps the field quiet under a stationary
        // pointer; a dot cannot chase itself out of its own hit target.
        const dx=home[i].x-pointer.x,dy=home[i].y-pointer.y;
        const distance=Math.hypot(dx,dy);
        if (distance<HOVER_RADIUS) {
          const q=1-distance/HOVER_RADIUS;
          const force=POINTER_FORCE*q*q/(distance+14);
          // A tiny stable bias also gives an exact centre hit a response.
          // It is smaller than the invisible grab target, so dots stay easy
          // to catch instead of fleeing the cursor.
          const core=Math.pow(Math.max(0,1-distance/12),2)*6;
          x+=(dx+Math.cos(i*2.39996323)*core)*force;
          y+=(dy+Math.sin(i*2.39996323)*core)*force;
        }
      }
      return {x,y};
    });
    links.forEach(e => {
      const a=particles[e.a],b=particles[e.b];
      const x=((b.x-a.x)-e.dx)*e.k,y=((b.y-a.y)-e.dy)*e.k;
      forces[e.a].x+=x;forces[e.a].y+=y;
      forces[e.b].x-=x;forces[e.b].y-=y;
    });
    // Short-range repulsion stops pulled nodes piling into one another.
    // Every rest pair is outside its own exclusion radius, including the
    // deliberately tight joints around the feet.
    for (let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++) {
      const a=particles[i],b=particles[j],ha=home[i],hb=home[j];
      let dx=b.x-a.x,dy=b.y-a.y,distance=Math.hypot(dx,dy);
      const gap=Math.min(Math.hypot(hb.x-ha.x,hb.y-ha.y)*.8,ha.r+hb.r+4)-distance;
      if(gap<=0)continue;
      if(distance<.01){dx=hb.x-ha.x;dy=hb.y-ha.y;distance=Math.hypot(dx,dy);}
      const f=gap*260/distance,x=dx*f,y=dy*f;
      forces[i].x-=x;forces[i].y-=y;forces[j].x+=x;forces[j].y+=y;
    }
    const damping=Math.exp(-DAMPING*dt);
    particles.forEach((n,i) => {
      if (drag && i===drag.i) return;
      n.vx=(n.vx+forces[i].x*dt)*damping;
      n.vy=(n.vy+forces[i].y*dt)*damping;
      const speed=Math.hypot(n.vx,n.vy);
      if (speed>MAX_SPEED) { n.vx*=MAX_SPEED/speed;n.vy*=MAX_SPEED/speed; }
      n.x+=n.vx*dt;n.y+=n.vy*dt;
    });
  }
  function step(dt) {
    if (media.matches || !alive) return;
    accumulator+=Math.max(0,Math.min(dt,.05));
    while (accumulator>=STEP) { integrate(STEP);accumulator-=STEP; }
    draw();
    if (!drag && !hasHover()) {
      const resting=particles.every((n,i) =>
        Math.hypot(n.x-home[i].x,n.y-home[i].y)<.025 && Math.hypot(n.vx,n.vy)<.1);
      if (resting) restore();
    }
  }
  function clearHover() { pointer.inside=false; }
  function endDrag(event,cancelled=false) {
    if (!drag || (event && event.pointerId!==undefined && event.pointerId!==drag.id)) return;
    const previous=drag,n=particles[previous.i];
    drag=null;
    svg.removeAttribute('data-grabbing');
    try { if (svg.hasPointerCapture(previous.id)) svg.releasePointerCapture(previous.id); } catch (_) {}
    // Ignore stale movement when someone holds the chair still, then lets go.
    const recent=!cancelled && performance.now()-previous.lastMove<85;
    n.vx=recent ? previous.vx*.22 : 0;n.vy=recent ? previous.vy*.22 : 0;
    clearHover();hoverSuppressed=true;alive=true;
    if (media.matches) restore();
  }
  function down(event) {
    if (drag || event.button!==0 || event.isPrimary===false) return;
    const p=localPoint(event);if (!p) return;
    const i=nearest(p,event.pointerType==='touch');if (i<0) return;
    const n=particles[i];
    drag={i,id:event.pointerId,x:n.x,y:n.y,offsetX:p.x-n.x,offsetY:p.y-n.y,vx:0,vy:0,lastMove:performance.now()};
    clearHover();alive=true;
    svg.setAttribute('data-grabbing','true');
    try { svg.setPointerCapture(event.pointerId); } catch (_) {}
    event.preventDefault();
  }
  function move(event) {
    if (drag && event.pointerId!==drag.id) return;
    const p=localPoint(event);if (!p) return;
    if (drag) {
      const target=targetFor(p),now=performance.now(),dt=Math.max(.008,(now-drag.lastMove)/1000);
      drag.vx=drag.vx*.35+(target.x-drag.x)/dt*.65;
      drag.vy=drag.vy*.35+(target.y-drag.y)/dt*.65;
      const speed=Math.hypot(drag.vx,drag.vy);
      if (speed>MAX_SPEED) { drag.vx*=MAX_SPEED/speed;drag.vy*=MAX_SPEED/speed; }
      drag.x=target.x;drag.y=target.y;drag.lastMove=now;
      // The held point follows the input immediately, not a frame later.
      pin();
      if (media.matches) solveStill();else draw();
      alive=true;
      event.preventDefault();
    } else if (event.pointerType!=='touch' && event.buttons===0) {
      hoverSuppressed=false;pointer={x:p.x,y:p.y,inside:true};
      if (hasHover()) alive=true;
    }
  }
  // Some engines negotiate touch gestures at the outer SVG rather than
  // the tiny graphics element. Cancel native handling only after a node
  // was actually caught.
  const ownTouch=event=>{if(drag && event.cancelable)event.preventDefault();};
  svg.addEventListener('touchstart',ownTouch,{passive:false});
  svg.addEventListener('touchmove',ownTouch,{passive:false});
  svg.addEventListener('pointerdown',down);
  svg.addEventListener('pointermove',move,{passive:false});
  svg.addEventListener('pointerleave',clearHover);
  svg.addEventListener('pointerup',event=>endDrag(event));
  svg.addEventListener('pointercancel',event=>endDrag(event,true));
  svg.addEventListener('lostpointercapture',event=>endDrag(event,true));
  svg.addEventListener('dragstart',event=>event.preventDefault());
  window.addEventListener('keydown',event=>{if(event.key==='Escape') endDrag(null,true);});
  window.addEventListener('blur',()=>{endDrag(null,true);clearHover();});
  const onResize=()=>{endDrag(null,true);clearHover();restore();updateMetrics();};
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(svg);
  else window.addEventListener('resize',onResize,{passive:true});
  media.addEventListener('change',()=>{endDrag(null,true);clearHover();restore();});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){endDrag(null,true);clearHover();restore();}
  });

  let previous = performance.now(), time = 0;
  function tick(now) {
    const dt = Math.min((now-previous)/1000,.08); previous = now;
    step(dt);
    if (!media.matches) {
      time += dt;
      packets.forEach((packet,i) => {
        const p = routePosition(routes[i],mod(time/11+i*.29,1));
        packet.dot.setAttribute('cx',p.x);packet.dot.setAttribute('cy',p.y);
        packet.halo.setAttribute('cx',p.x);packet.halo.setAttribute('cy',p.y);
      });
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
